schema_version: 3

product_id: <product-slug>
product_name: <Product Name>
category: <category>
language: en
market: international-b2b
canonical_product_url: <url>

summary_file: product.md

asset_store:
  provider: cloudflare_r2
  bucket: product-assets
  public_base_url: https://assets.licat.xyz/products/<product-slug>

# Binary files are staged locally under docs/ and images/, but are not committed to Git.
# After upload, add only entries that actually exist in R2.
documents: []

# Example document entry:
# documents:
#   - id: user-manual
#     type: user_manual
#     local_path: docs/user-manual.pdf
#     object_key: products/<product-slug>/docs/user-manual.pdf
#     url: https://assets.licat.xyz/products/<product-slug>/docs/user-manual.pdf
#     authority: authoritative
#     notes: Primary operating and specification source.

images: []

# Example image entry:
# images:
#   - id: hero-01
#     role: primary_product_reference
#     local_path: images/hero-01.jpg
#     object_key: products/<product-slug>/images/hero-01.jpg
#     url: https://assets.licat.xyz/products/<product-slug>/images/hero-01.jpg
#     notes: Primary full-product reference.

# Evidence priority when sources disagree.
evidence_priority:
  - user_confirmed_override
  - authoritative_document
  - directly_observed_image_fact
  - derived_product_summary
  - reasonable_creative_inference

claims_policy:
  allow_reasonable_creative_inference: true
  require_source_for_exact_spec: true
  invent_exact_specs: false
  invent_certifications: false
  invent_awards: false
  invent_test_results: false
  invent_brand_partnerships: false
  invent_regulated_claims: false

detailflow:
  screens: 8
  final_slice_ratio: "9:21"
  visible_copy_language: en
  approval_gates: 2
  require_input_analysis: true
  require_source_document_review: true
  require_blueprint_before_generation: true
  require_early_two_slice_preview: true
  require_final_concat_audit: true
